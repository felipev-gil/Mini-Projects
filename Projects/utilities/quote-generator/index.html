<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quote Generator · Mini Projects</title>
    <meta
      name="description"
      content="Browse a local collection of quotations and copy one to your clipboard."
    />
    <link rel="icon" href="../../../Assets/favicon.svg" />
    <link rel="stylesheet" href="../../../Shared/style.css" />
    <link rel="stylesheet" href="../../../Shared/project.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../../Shared/script.js"></script>
  </head>
  <body class="project-page">
    <div id="header-component"></div>
    <main id="main" class="mini-app">
      <h1>Quote Generator</h1>
      <p class="intro">
        Browse a local collection of quotations and copy one to your clipboard.
      </p>
      <div class="panel">
        <blockquote>
          <p id="quote" class="readout"></p>
          <footer id="author"></footer>
        </blockquote>
        <div class="actions">
          <button id="next" class="primary">New quote</button
          ><button id="copy">Copy quote</button>
        </div>
        <p class="note">
          Quote text and attributed authors are preserved from the original
          example; attributions have not been independently verified.
        </p>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p class="note">
        Adapted from the preserved
        <a href="../../../Projects%20Examples/Quote%20Generator/index.html"
          >Quote Generator example</a
        >.
      </p>
    </main>
    <div id="footer-component"></div>
    <script src="../../../Shared/project.js"></script>
    <script src="script.js"></script>
  </body>
</html>
